<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f7ff">
<title>그림으로 배우는 덧셈</title>
<style>
:root{--ink:#273247;--muted:#657187;--blue:#4965d9;--line:#cbd4e4;--paper:#fff}
*{box-sizing:border-box}body{margin:0;background:#f1f3f7;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
main{max-width:900px;margin:auto;padding:18px 14px 38px}.hero{text-align:center;padding:10px 8px 18px}.eyebrow{color:var(--blue);font-weight:800;font-size:.78rem;letter-spacing:.08em}.hero h1{font-size:clamp(1.65rem,5vw,2.25rem);margin:6px 0}.hero p{margin:0;color:var(--muted);font-size:.94rem;line-height:1.6}
.progress{height:7px;background:#dfe4ee;border-radius:99px;overflow:hidden;margin-bottom:14px}.progress-fill{height:100%;background:#6a82e8;width:0;transition:width .2s}
.sheet{background:var(--paper);border:1px solid #d7dce6;border-radius:12px;padding:clamp(12px,3vw,24px);box-shadow:0 8px 26px #25304a0a}.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.tag{font-size:.82rem;font-weight:800;background:#edf1ff;color:#3f56bb;border-radius:8px;padding:6px 10px}.score{font-size:.82rem;color:var(--muted)}.instruction{font-size:1rem;font-weight:750;margin:0 0 13px;line-height:1.6}
.worksheet{display:grid;grid-template-columns:minmax(150px,1.05fr) minmax(190px,1.15fr) minmax(76px,.48fr);border:2px solid #7d8aa0;border-radius:10px;overflow:hidden;min-height:270px}
.words{padding:15px 12px;display:flex;flex-direction:column;justify-content:space-around;gap:14px;font-size:.94rem;line-height:1.75;border-right:1px solid var(--line)}.sentence{margin:0}.inline-answer{width:55px;height:39px;border:1.5px solid #aeb9ca;border-radius:5px;text-align:center;font-size:1.15rem;font-weight:800;color:var(--ink);vertical-align:middle;background:#fff;outline:none}.inline-answer:focus,.eq-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #4965d922}
.pictures{padding:12px 10px;display:flex;flex-direction:column;justify-content:space-around;gap:10px;border-right:1px solid var(--line);min-width:0}.picture-row{display:flex;flex-wrap:wrap;align-content:center;justify-content:flex-start;gap:4px;min-height:48px;padding:7px;border-radius:7px;background:#f8f9fc}.picture-row.total-row{background:#f0f4ff}.object{display:inline-block;font-size:clamp(1.35rem,3.8vw,2rem);line-height:1.25}
.equation-panel{padding:10px 6px;display:flex;align-items:center;justify-content:center}.vertical-equation{display:grid;grid-template-columns:18px minmax(42px,1fr);gap:4px 3px;align-items:center;width:100%;max-width:110px}.eq-input{width:100%;min-width:0;height:39px;border:1.5px solid #aeb9ca;border-radius:5px;text-align:center;font-size:1.1rem;font-weight:800;background:white;color:var(--ink);outline:none}.eq-symbol{font-size:1.2rem;text-align:center;font-weight:800}.eq-line{grid-column:1/3;height:2px;background:#5b6577;margin:0 0 2px}
.controls{display:flex;gap:10px;margin-top:16px}.btn{border:0;border-radius:12px;padding:13px 17px;font-size:.97rem;font-weight:800;cursor:pointer;touch-action:manipulation}.primary{background:var(--blue);color:white;flex:1}.secondary{background:#e9edf5;color:var(--ink)}.btn:disabled{opacity:.55;cursor:not-allowed}.feedback{margin-top:13px;padding:12px 14px;border-radius:10px;line-height:1.65;font-size:.94rem}.feedback.good{background:#e9f7ef;color:#126643}.feedback.try{background:#fff4df;color:#81530b}.hidden{display:none!important}.hint{font-size:.84rem;color:var(--muted);line-height:1.6;margin:13px 2px 0}.finish{text-align:center;padding:26px 12px}.finish .emoji{font-size:3rem}.finish h2{margin:5px}.finish p{color:var(--muted);line-height:1.7}input:disabled{background:#f0f2f6;color:#4a5568}
@media(max-width:560px){main{padding:12px 9px 28px}.worksheet{grid-template-columns:minmax(100px,.9fr) minmax(120px,1.1fr) 68px;min-height:245px}.words{padding:10px 7px;font-size:.82rem;gap:8px}.pictures{padding:8px 5px;gap:7px}.picture-row{padding:5px 3px;gap:2px}.object{font-size:1.35rem}.equation-panel{padding:6px 3px}.vertical-equation{grid-template-columns:15px minmax(35px,1fr);gap:4px 2px}.eq-input{height:35px;font-size:1rem}.eq-symbol{font-size:1.05rem}.inline-answer{width:43px;height:34px;font-size:1rem}.sheet{padding:11px}.controls{flex-direction:column}.secondary{width:100%}}
</style>
</head>
<body>
<main>
<header class="hero"><div class="eyebrow">초등 수학 · 덧셈 문장제</div><h1>📝 그림 덧셈 문제</h1><p>글을 읽고, 그림을 세어 보세요.<br>빈칸에 알맞은 수를 직접 써 넣어요.</p></header>
<div class="progress"><div id="progressBar" class="progress-fill"></div></div>
<section id="quiz" class="sheet">
<div class="sheet-head"><span id="problemNo" class="tag">문제 1</span><span id="score" class="score">맞힌 문제 0 / 3</span></div>
<p id="instruction" class="instruction">글을 읽고, 빈칸에 알맞은 수를 써 넣으세요.</p>
<div class="worksheet">
<div class="words" id="words"></div>
<div class="pictures" id="pictures"></div>
<div class="equation-panel"><div class="vertical-equation" aria-label="세로 덧셈식"><span class="eq-symbol"></span><input id="addA" class="eq-input" type="number" inputmode="numeric" aria-label="첫 번째 수" autocomplete="off"><span class="eq-symbol">+</span><input id="addB" class="eq-input" type="number" inputmode="numeric" aria-label="두 번째 수" autocomplete="off"><div class="eq-line"></div><span class="eq-symbol"></span><input id="sum" class="eq-input" type="number" inputmode="numeric" aria-label="덧셈 결과" autocomplete="off"></div></div>
</div>
<div id="feedback" class="feedback hidden" role="status"></div>
<div class="controls"><button type="button" id="check" class="btn primary">정답 확인</button><button type="button" id="next" class="btn secondary hidden">다음 문제 →</button></div>
<p class="hint">💡 첫 번째 그림과 두 번째 그림을 각각 세어 보세요. 오른쪽에는 세로셈을 쓰고, 왼쪽 마지막 문장의 빈칸에도 모두의 수를 써 보세요.</p>
</section>
<section id="finish" class="sheet finish hidden"><div class="emoji">🎉</div><h2>참 잘했어요!</h2><p id="result"></p><button type="button" id="restart" class="btn primary">다시 풀기</button></section>
</main>
<script>
(function(){
'use strict';
function makeProblems(){
 const bank=[
  {aName:"장난감 자동차",aEmoji:"🚙",bName:"장난감 블록",bEmoji:"🧱",unit:"개",storyA:"장난감 자동차가 {a}개 있습니다.",storyB:"장난감 블록이 {b}개 있습니다.",storyTotal:"장난감 자동차와 장난감 블록은 모두",intro:"장난감 자동차와 장난감 블록의 개수를 더해 보세요."},
  {aName:"오리",aEmoji:"🦆",bName:"닭",bEmoji:"🐔",unit:"마리",storyA:"오리가 {a}마리 있습니다.",storyB:"닭이 {b}마리 있습니다.",storyTotal:"오리와 닭은 모두",intro:"오리와 닭의 수를 더해 보세요."},
  {aName:"사과",aEmoji:"🍎",bName:"배",bEmoji:"🍐",unit:"개",storyA:"사과가 {a}개 있습니다.",storyB:"배가 {b}개 있습니다.",storyTotal:"사과와 배는 모두",intro:"사과와 배의 개수를 더해 보세요."},
  {aName:"물고기",aEmoji:"🐟",bName:"문어",bEmoji:"🐙",unit:"마리",storyA:"물고기가 {a}마리 있습니다.",storyB:"문어가 {b}마리 있습니다.",storyTotal:"물고기와 문어는 모두",intro:"물고기와 문어의 수를 더해 보세요."},
  {aName:"연필",aEmoji:"✏️",bName:"지우개",bEmoji:"🧽",unit:"개",storyA:"연필이 {a}개 있습니다.",storyB:"지우개가 {b}개 있습니다.",storyTotal:"연필과 지우개는 모두",intro:"연필과 지우개의 개수를 더해 보세요."},
  {aName:"버스",aEmoji:"🚌",bName:"자동차",bEmoji:"🚗",unit:"대",storyA:"버스가 {a}대 있습니다.",storyB:"자동차가 {b}대 있습니다.",storyTotal:"버스와 자동차는 모두",intro:"버스와 자동차의 수를 더해 보세요."}
 ];
 const shuffled=bank.slice().sort(()=>Math.random()-.5).slice(0,3);
 return shuffled.map(item=>{
  const a=2+Math.floor(Math.random()*6), b=2+Math.floor(Math.random()*6);
  return {...item,a,b,storyA:item.storyA.replace("{a}",a),storyB:item.storyB.replace("{b}",b)};
 });
}
const problems=makeProblems();
let index=0,score=0,checked=false;
function el(id){return document.getElementById(id)}
function makeRow(emoji,n,total){let html='<div class="picture-row'+(total?' total-row':'')+'" aria-label="'+n+'개">';for(let i=0;i<n;i++)html+='<span class="object" aria-hidden="true">'+emoji+'</span>';return html+'</div>'}
function render(){
 const p=problems[index];checked=false;
 el('problemNo').textContent='문제 '+(index+1);
 el('score').textContent='맞힌 문제 '+score+' / '+problems.length;
 el('instruction').textContent=p.intro;
 el('words').innerHTML='<p class="sentence">'+p.storyA+'</p><p class="sentence">'+p.storyB+'</p><p class="sentence">'+p.storyTotal+' <input id="sentenceTotal" class="inline-answer" type="number" inputmode="numeric" aria-label="모두의 수" autocomplete="off"> '+p.unit+' 있습니다.</p>';
 el('pictures').innerHTML=makeRow(p.aEmoji,p.a,false)+makeRow(p.bEmoji,p.b,false)+makeRow(p.aEmoji,p.a+p.b,true);
 const combined=el('pictures').lastElementChild;
 combined.innerHTML='';for(let i=0;i<p.a;i++)combined.insertAdjacentHTML('beforeend','<span class="object" aria-hidden="true">'+p.aEmoji+'</span>');for(let i=0;i<p.b;i++)combined.insertAdjacentHTML('beforeend','<span class="object" aria-hidden="true">'+p.bEmoji+'</span>');
 combined.setAttribute('aria-label','모두 '+(p.a+p.b)+'개');
 ['addA','addB','sum'].forEach(id=>{el(id).value='';el(id).disabled=false});
 el('sentenceTotal').value='';el('sentenceTotal').disabled=false;
 el('feedback').className='feedback hidden';el('feedback').textContent='';
 el('check').classList.remove('hidden');el('check').disabled=false;el('next').classList.add('hidden');
 el('progressBar').style.width=(index/problems.length*100)+'%';
}
function checkAnswer(){
 if(checked)return;
 const p=problems[index],ids=['addA','addB','sum','sentenceTotal'];
 if(ids.some(id=>!el(id)||el(id).value.trim()==='')){el('feedback').className='feedback try';el('feedback').textContent='네 칸에 숫자를 모두 써 주세요.';return}
 checked=true;
 const ok=Number(el('addA').value)===p.a&&Number(el('addB').value)===p.b&&Number(el('sum').value)===p.a+p.b&&Number(el('sentenceTotal').value)===p.a+p.b;
 if(ok)score++;
 el('feedback').className='feedback '+(ok?'good':'try');
 el('feedback').textContent=ok?'🌟 모두 맞았어요! '+p.a+' + '+p.b+' = '+(p.a+p.b)+'. 세로셈과 문장의 답을 모두 잘 썼어요!':'그림을 다시 세어 보세요. 첫 번째는 '+p.a+', 두 번째는 '+p.b+'입니다. 모두 '+(p.a+p.b)+p.unit+'예요. 빈칸 네 곳을 확인해 보세요.';
 ids.forEach(id=>{el(id).disabled=true});
 el('score').textContent='맞힌 문제 '+score+' / '+problems.length;
 el('check').classList.add('hidden');el('next').classList.remove('hidden');
 el('next').textContent=index===problems.length-1?'결과 보기':'다음 문제 →';
 el('progressBar').style.width=((index+1)/problems.length*100)+'%';
}
function next(){if(index<problems.length-1){index++;render()}else{finish()}}
function finish(){el('quiz').classList.add('hidden');el('finish').classList.remove('hidden');el('progressBar').style.width='100%';el('result').textContent='세 문제를 모두 풀었어요. '+score+'문제를 맞혔습니다. '+(score===problems.length?'덧셈 실력이 멋져요!':'괜찮아요. 그림을 세면서 다시 연습해 봐요.')}
function restart(){index=0;score=0;el('quiz').classList.remove('hidden');el('finish').classList.add('hidden');render()}
el('check').addEventListener('click',checkAnswer);
el('next').addEventListener('click',next);
el('restart').addEventListener('click',restart);
['addA','addB','sum','sentenceTotal'].forEach((id,i,ids)=>{document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target&&e.target.id===id){e.preventDefault();if(i<ids.length-1){const nextInput=el(ids[i+1]);if(nextInput)nextInput.focus()}else checkAnswer()}})});
render();
})();
</script>
</body>
</html>
